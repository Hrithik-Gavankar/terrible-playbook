---
# Reference copy of collection-backed tasks removed from site.yml for no-Galaxy demos.
# Restoring these in site.yml will trigger Galaxy collection installs again.
- hosts: localhost
  tasks:
    - name: Manage INI file with wrong args
      community.general.ini_file:
        dest: /etc/app/settings.ini
        section: app
        option: port
        value: 8080
        invalid_param: true
        mode: 644
    - name: Manage a sysctl value
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
    - name: Create a cron job badly
      community.general.cronvar:
        name: APP_HOME
        value: /opt/app
        invalid_option: true
    - name: Configure IOS banner
      cisco.ios.ios_banner:
        banner: motd
        text: "Unauthorized access prohibited"
        state: present
      delegate_to: localhost
